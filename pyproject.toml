[project]
name = "semantic-search-engine"
version = "0.1.0"
description = "Semantic search over space-domain (arXiv astro-ph) abstracts with bi-encoder dense retrieval and ChromaDB."
requires-python = ">=3.10"
dependencies = [
    "sentence-transformers>=5.0,<6.0",
    "chromadb>=1.5,<2.0",
    "requests>=2.32,<3.0",
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
